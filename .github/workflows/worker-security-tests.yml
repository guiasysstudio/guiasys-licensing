name: Worker Security Tests

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "worker/**"
      - "assets/js/app.js"
      - "assets/css/app.css"
      - "assets/js/entitlement-verifier.js"
      - "index.html"
      - ".github/workflows/worker-security-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - "assets/js/app.js"
      - "assets/css/app.css"
      - "assets/js/entitlement-verifier.js"
      - "index.html"
      - ".github/workflows/worker-security-tests.yml"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker security tests
        working-directory: worker
        run: npm test

      - name: Check frontend JavaScript syntax
        run: |
          node --experimental-default-type=module --check assets/js/app.js
          node --experimental-default-type=module --check assets/js/entitlement-verifier.js
